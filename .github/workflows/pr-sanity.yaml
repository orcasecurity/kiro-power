name: PR CI Checks

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  runner-selector:
    uses: orcasecurity/ghrw-runner-selector/.github/workflows/runner-selector.yaml@v1
    secrets: inherit
    with:
      cpu: 2
      memory: 8
      preemptable: true

  pre-commit-check:
    name: Pre-commit checks
    needs:
      - runner-selector
    runs-on: ${{ needs.runner-selector.outputs.runs-on }}
    container:
      image: 552936520451.dkr.ecr.us-east-1.amazonaws.com/orca/orca-github-workflow-images/extra:1.2.0
      credentials:
        username: AWS
        password: ${{ secrets.ECR_TOKEN }}
      volumes: ${{ fromJson(needs.runner-selector.outputs.container-volumes) }}
      env: ${{ fromJson(needs.runner-selector.outputs.container-environment) }}

    steps:
      - uses: actions/checkout@v7

      - uses: pre-commit/action@v3.0.1
